[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-graph-tools"
version = "0.1.0"
description = "Small graph tools for Kempton research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["networkx>=3.0", "numpy>=1.24", "plotly>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]
